database:
  hostName: 127.0.0.1
  hostPort: 3306
  databaseName: orangehrm_mysql
  privilegedDatabaseUser: root
  privilegedDatabasePassword: root
  useSameDbUserForOrangeHRM: y # y/n, if this field `n` fill `orangehrmDatabaseUser` and `orangehrmDatabasePassword`
  orangehrmDatabaseUser: ~
  orangehrmDatabasePassword: ~
  isExistingDatabase: n # y/n
  enableDataEncryption: n # y/n

organization:
  name: OrangeHRM
  country: US

instance:
  # Used in password reset emails: the OrangeHRM address as shown in the browser before /auth/login,
  # e.g. https://hr.example.com/orangehrm/index.php for https://hr.example.com/orangehrm/index.php/auth/login
  # (internationalised domain names in punycode form, xn--...)
  baseUrl: ~

admin:
  adminUserName: Admin
  adminPassword: Ohrm@1423
  adminEmployeeFirstName: OrangeHRM
  adminEmployeeLastName: Admin
  workEmail: admin@example.com
  contactNumber: ~
  registrationConsent: true

license:
  agree: y # y/n
