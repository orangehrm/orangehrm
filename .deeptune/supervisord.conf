[supervisord] 
nodaemon=true 
user=root 
loglevel=debug
logfile=/deeptune/supervisord.log 
 
[program:apache2] 
command=/usr/sbin/apache2ctl -D FOREGROUND 
autostart=true 
autorestart=true 
stderr_logfile=/var/log/apache2.err.log 
stdout_logfile=/var/log/apache2.out.log 
 
[program:postgresql] 
command=/bin/bash -c "service postgresql start && echo 'PostgreSQL started' && tail -f /var/log/postgresql/postgresql-16-main.log" 
autostart=true 
autorestart=true 
stderr_logfile=/var/log/postgresql.err.log 
stdout_logfile=/var/log/postgresql.out.log
