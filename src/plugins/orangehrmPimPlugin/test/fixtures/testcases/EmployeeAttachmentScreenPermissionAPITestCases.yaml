GetAll:
  "Admin reads a subordinate's salary attachments":
    userId: 1
    services: &services
      pim.employee_service: \OrangeHRM\Pim\Service\EmployeeService
      admin.user_service: \OrangeHRM\Admin\Service\UserService
      core.config_service: \OrangeHRM\Core\Service\ConfigService
      core.authorization.user_role_manager_helper: \OrangeHRM\Core\Authorization\Helper\UserRoleManagerHelper
    factories: &factories
      core.authorization.user_role_manager: [ '\OrangeHRM\Core\Authorization\Manager\UserRoleManagerFactory', 'getNewUserRoleManager' ]
    attributes:
      empNumber: 3
      screen: salary
    data: [{"id": 1, "description": "offer", "filename": "offer.pdf", "size": 10, "fileType": "application/pdf", "attachedBy": 1, "attachedByName": "admin", "attachedTime": "09:00", "attachedDate": "2026-11-01"}]
    meta: {"empNumber": 3, "screen": "salary", "total": 1}
  "Supervisor reads a subordinate's personal attachments":
    userId: 2
    services: *services
    factories: *factories
    attributes:
      empNumber: 3
      screen: personal
    data: [{"id": 2, "description": "cv", "filename": "cv.pdf", "size": 10, "fileType": "application/pdf", "attachedBy": 1, "attachedByName": "admin", "attachedTime": "09:00", "attachedDate": "2026-11-01"}]
    meta: {"empNumber": 3, "screen": "personal", "total": 1}
  "Supervisor cannot read a subordinate's salary attachments":
    userId: 2
    services: *services
    factories: *factories
    attributes:
      empNumber: 3
      screen: salary
    exception:
      class: 'OrangeHRM\Core\Api\V2\Exception\ForbiddenException'
  "Supervisor reads own salary attachments":
    userId: 2
    services: *services
    factories: *factories
    attributes:
      empNumber: 2
      screen: salary
    data: [{"id": 1, "description": "offer", "filename": "sam-offer.pdf", "size": 10, "fileType": "application/pdf", "attachedBy": 1, "attachedByName": "admin", "attachedTime": "09:00", "attachedDate": "2026-11-01"}]
    meta: {"empNumber": 2, "screen": "salary", "total": 1}
  "ESS reads own salary attachments":
    userId: 3
    services: *services
    factories: *factories
    attributes:
      empNumber: 3
      screen: salary
    data: [{"id": 1, "description": "offer", "filename": "offer.pdf", "size": 10, "fileType": "application/pdf", "attachedBy": 1, "attachedByName": "admin", "attachedTime": "09:00", "attachedDate": "2026-11-01"}]
    meta: {"empNumber": 3, "screen": "salary", "total": 1}
  "Supervisor cannot read an unrelated employee's attachments":
    userId: 2
    services: *services
    factories: *factories
    attributes:
      empNumber: 4
      screen: personal
    invalidOnly: [ empNumber ]
  "Employment contract files are not listed through the attachments API":
    userId: 1
    services: *services
    factories: *factories
    attributes:
      empNumber: 3
      screen: contract
    invalidOnly: [ screen ]

GetOne:
  "Admin reads a subordinate's salary attachment":
    userId: 1
    services: *services
    factories: *factories
    attributes:
      empNumber: 3
      screen: salary
      id: 1
    data: {"id": 1, "description": "offer", "filename": "offer.pdf", "size": 10, "fileType": "application/pdf", "attachedBy": 1, "attachedByName": "admin", "attachedTime": "09:00", "attachedDate": "2026-11-01"}
    meta: {"empNumber": 3, "screen": "salary"}
  "Supervisor cannot read a subordinate's salary attachment":
    userId: 2
    services: *services
    factories: *factories
    attributes:
      empNumber: 3
      screen: salary
      id: 1
    exception:
