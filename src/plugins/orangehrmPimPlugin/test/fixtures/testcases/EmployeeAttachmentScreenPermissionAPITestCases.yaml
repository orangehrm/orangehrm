Create:
  "Supervisor cannot add a salary attachment for a subordinate":
    userId: 2
    services: *services
    factories: *factories
    attributes:
      empNumber: 3
      screen: salary
    body: &attachmentBody
      attachment: {"name": "new.txt", "type": "text/plain", "base64": "bmV3", "size": 3}
    exception:
      class: 'OrangeHRM\Core\Api\V2\Exception\ForbiddenException'
  "ESS cannot add a salary attachment to own record":
    userId: 3
    services: *services
    factories: *factories
    attributes:
      empNumber: 3
      screen: salary
    body: *attachmentBody
    exception:
      class: 'OrangeHRM\Core\Api\V2\Exception\ForbiddenException'
  "Admin adds a salary attachment for a subordinate":
    userId: 1
    services: *services
    factories: *factories
    now:
      datetime: '2026-11-17 10:30:00'
