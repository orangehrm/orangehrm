GetOne:
  'Get one Provider by Id':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    attributes:
      id: 1
    data: {
        id: '1',
        providerName: 'Google',
        providerUrl: 'https://accounts.google.com',
        status: true,
        clientId: '4456598880504gsb35si9gni9l6t0hn.apps.googleusercontent.com',
        requireVerifiedEmail: false,
        requireMatchingSubject: false
    }

  'Get one Provider by Id - not available id':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    attributes:
      id: 100
    exception:
      class: '\OrangeHRM\Core\Api\V2\Exception\RecordNotFoundException'
      message: 'Record Not Found'

Delete:
  'Delete Provider - Admin User':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    body:
      ids: [ 1 ]
    data: [ 1 ]

  'Delete Multiple Provider - Admin User':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    body:
      ids: [ 1, 2, 3 ]
    data: [ 1, 2, 3 ]

Update:
  'Update Existing Provider - Admin User':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    attributes:
      id: 1
    body:
      name: 'Azure AD'
      url: 'https://azure.auth.com'
      clientId: '6f2182cc5083a84083b'
      clientSecret: '0f0cc6f83baf5f43c609ec9752'
    data:
      id: 1
      providerName: 'Azure AD'
      providerUrl: 'https://azure.auth.com'
      status: true
      clientId: '6f2182cc5083a84083b'
      requireVerifiedEmail: false
      requireMatchingSubject: false

  'Update Existing Provider - turn both sign-in checks on':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    attributes:
      id: 1
    body:
      name: 'Azure AD'
      url: 'https://azure.auth.com'
      clientId: '6f2182cc5083a84083b'
      requireVerifiedEmail: true
      requireMatchingSubject: true
    data:
      id: 1
      providerName: 'Azure AD'
      providerUrl: 'https://azure.auth.com'
      status: true
      clientId: '6f2182cc5083a84083b'
      requireVerifiedEmail: true
      requireMatchingSubject: true

  'Update Existing Provider - Invalid Id':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    attributes:
      id: 100
    body:
      name: 'Azure AD'
      url: 'https://azure.auth.com'
      status: true
      clientId: '6f2182cc5083a84083b'
      clientSecret: '0f0cc6f83baf5f43c609ec9752'
    exception:
      class: '\OrangeHRM\Core\Api\V2\Exception\InvalidParamException'
      message: 'Invalid Parameter'

  'Update Existing Provider - Without Name Id':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    attributes:
      id: 1
    body:
      name: null
      url: 'https://azure.auth.com'
      status: true
      clientId: '6f2182cc5083a84083b'
      clientSecret: '0f0cc6f83baf5f43c609ec9752'
    exception:
      class: '\OrangeHRM\Core\Api\V2\Exception\InvalidParamException'
      message: 'Invalid Parameter'

Create:
  'Create Auth Provider':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    body:
      name: 'Azure'
      url: 'https://azure.auth.com'
      clientId: '6f2182cc5083a84083b'
      clientSecret: '0f0cc6f2182cc5083a84083baf5f43c609ec9752'
    data:
      id: 5
      providerName: 'Azure'
      providerUrl: 'https://azure.auth.com'
      status: true
      clientId: '6f2182cc5083a84083b'
      requireVerifiedEmail: true
      requireMatchingSubject: true

  'Create Auth Provider with both sign-in checks off':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    body:
      name: 'Azure'
      url: 'https://azure.auth.com'
      clientId: '6f2182cc5083a84083b'
      clientSecret: '0f0cc6f2182cc5083a84083baf5f43c609ec9752'
      requireVerifiedEmail: false
      requireMatchingSubject: false
    data:
      id: 5
      providerName: 'Azure'
      providerUrl: 'https://azure.auth.com'
      status: true
      clientId: '6f2182cc5083a84083b'
      requireVerifiedEmail: false
      requireMatchingSubject: false

  'Create Auth Provider - sign-in check is not a boolean':
    userId: 1
    services:
      oidc.social_media_auth_service: \OrangeHRM\OpenidAuthentication\Service\SocialMediaAuthenticationService
    body:
      name: 'Azure'
      url: 'https://azure.auth.com'
      clientId: '6f2182cc5083a84083b'
      clientSecret: '0f0cc6f2182cc5083a84083baf5f43c609ec9752'
      requireVerifiedEmail: 'yes'
    invalidOnly: [requireVerifiedEmail]
