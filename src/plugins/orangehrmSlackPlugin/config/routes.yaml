apiv2_admin_slack_notification_config:
  path: /api/v2/admin/slack-notification/config
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericRestController::handle
  methods: [ GET, PUT ]
  defaults:
    id: 0
    _api: OrangeHRM\Slack\Api\SlackConfigAPI

apiv2_admin_slack_notification_registrations:
  path: /api/v2/admin/slack-notification/registrations
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericRestController::handle
  methods: [ GET ]
  defaults:
    _api: OrangeHRM\Slack\Api\SlackRegistrationAPI

apiv2_admin_slack_notification_test:
  path: /api/v2/admin/slack-notification/registrations/test
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericRestController::handle
  methods: [ POST ]
  defaults:
    _api: OrangeHRM\Slack\Api\SlackTestWebhookAPI

apiv2_admin_slack_notification_registration_test:
  path: /api/v2/admin/slack-notification/registrations/{id}/test
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericRestController::handle
  methods: [ POST ]
  defaults:
    _api: OrangeHRM\Slack\Api\SlackTestWebhookAPI
